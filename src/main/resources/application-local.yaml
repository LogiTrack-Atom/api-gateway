server:
  port: ${SERVER_PORT:8066}

spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false

eureka:
  client:
    enabled: false

logitrack:
  security:
    issuer: logitrack-security
    audience: logitrack-api
    access-token-ttl: 15m
    clock-skew: 60s
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION}
  config:
    marker: api-gateway-local
